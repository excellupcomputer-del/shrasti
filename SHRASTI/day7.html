<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <script>
        function daynumber() {
        let daynumber = Number(prompt("Day Finder"));
        switch (daynumber){
            case 1:
                console.log("Monday");
                break;

            case 2:
                console.log("Tuesday");
                break;

            case 3:
                console.log("Wednesday");
                break;

            case 4:
                console.log("Thusday");
                break;

            case 5:
                console.log("Friday");
                break;

            case 6:
                console.log("Saturday");
                break;

            case 7:
                console.log("Sunday");
                break;

            default:
                console.log("invalid day");

        }
    }


        function evennumber() {
        let num = prompt("Enter number:");
        let sum = 0;

        for (let i = 0; i <= num; i + 2) {

            console.log(i)
            sum = sum + i;
            console.log("sum of even number:", sum);
        }
        }


        function grade() {
        let grade = Number(prompt("Grade message"));
        switch (grade) {
            case A:
                console.log("Excellent");
                break;

            case B:
                console.log("Very good");
                break;

            case C:
                console.log("Good");
                break;

            case D:
                console.log("Pass");
                break;

            case F:
                console.log("Fail");
                break;
        
            default:
                console.log("invalid grade");

        }
    }

    </script>

</body>

</html>
