<body>
    <h1>To Do List:</h1>

    <div class="div">
        <input type="text" id="task" onkeypress="todolist(e)" placeholder="Enter your task">



    </div>

    <ul id="list"></ul>

</body>
<script>

    let taskText = document.querySelector("#task")
    let addText = document.querySelector("#btn")
    let list = document.querySelector("#list")
    let task = [];

    taskText.addEventListener("keypress", function (e) {
        if (e.key != "Enter") {
            return;
        }

        list.innerHTML = ""

        task.push(taskText.value)


        task.forEach((item) => {
            let li = document.createElement("li");

            li.innerText = item;

            list.appendChild(li);

            taskText.value = ""

        });

    })






</script>
